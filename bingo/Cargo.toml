[package]
name = "bingo"
version = "0.1.0"
edition = "2024"

[dependencies]
borsh = { version ="1.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wincode = { version = "0.4.4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "storage_benchmarks"
harness = false
